[project]
name = "hostel-email-agent"
version = "0.1.0"
description = "Drafts replies to hostel group booking emails in Outlook."
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0", "google-genai>=2.28", "pydantic>=2", "msal>=1.30", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hostel_agent"]
